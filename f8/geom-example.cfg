# MU1320 F5 geometry override for displayable 98 (the CarPlay map-box arrow).
# Copy to /tmp/mu1320-f5-geom.cfg, edit, save: applied within 0.25 s while the
# arrow or the calibration grid is shown.  rm the file to return to the stock
# Layout values.  A later line with the same key wins, so appending works:
#   echo 'popupX=1085' >> /tmp/mu1320-f5-geom.cfg
# Values are absolute cluster pixels; the current ones are the GEOM lines in
# /tmp/mu1320-f5-render.log.  Stock B9 Classic Layout values are shown below.

stage=auto            # auto (follow the VC view) | popup (large map) | intube (small map)
backing=on            # stock KDK backing box (101/102) behind the arrow: on | off

# Large map view ("popup" stage): destination of the cropped 98 on the cluster
#popupX=1091
#popupY=110
# Part of the 328x181 renderer surface that is shown
#popupCropX=59
#popupCropY=27
#popupCropW=210
#popupCropH=153

# Small map view ("in-tube" stage)
#inTubeX=1055
#inTubeY=207
#inTubeCropX=59
#inTubeCropY=27
#inTubeCropW=210
#inTubeCropH=153
